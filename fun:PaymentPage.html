<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unli-Internet - Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="shortcut icon" href="https://pngimg.com/d/wifi_PNG62268.png" type="image/x-icon">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        .form-element-1 { animation: fadeIn 0.6s ease-out forwards; animation-delay: 0.1s; }
        .form-element-2 { animation: fadeIn 0.6s ease-out forwards; animation-delay: 0.2s; }
        .form-element-3 { animation: fadeIn 0.6s ease-out forwards; animation-delay: 0.3s; }
        .form-element-4 { animation: fadeIn 0.6s ease-out forwards; animation-delay: 0.4s; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="p-8 w-full max-w-lg animate-fade-in">
        <div class="flex items-center justify-center mb-6 form-element-1">
            <p class="text-xl font-bold flex items-center"><span class="material-symbols-outlined text-yellow-500 mr-2">wifi</span>Unli-Internet</p>
        </div>
        <form>
            <div class="mb-4 form-element-2">
                <label for="cardNumber" class="block text-sm font-medium text-gray-700 mb-2">Card Number</label>
                <input type="text" id="cardNumber" placeholder="xxxx xxxx xxxx xxxx" autocomplete="cc-number" class="w-full p-4 border-2 border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600 transition-colors">
            </div>
            <div class="flex gap-4 mb-6 form-element-3">
                <div class="w-1/2">
                    <label for="expDate" class="block text-sm font-medium text-gray-700 mb-2">Expiration Date</label>
                    <input type="text" id="expDate" placeholder="MM/YY" autocomplete="cc-exp" class="w-full p-4 border-2 border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600 transition-colors">
                </div>
                <div class="w-1/2">
                    <label for="cvv" class="block text-sm font-medium text-gray-700 mb-2">CVV</label>
                    <input type="text" id="cvv" placeholder="xxx" autocomplete="cc-csc" class="w-full p-4 border-2 border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600 transition-colors">
                </div>
            </div>
            <button type="button" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors duration-200 form-element-4 shadow-md hover:shadow-lg">Pay Now</button>
            <div class="flex items-center justify-center mt-6 text-gray-500 form-element-4">
                <span class="material-symbols-outlined text-gray-500 mr-2">lock</span>
                <p class="text-sm">Payments are processed securely</p>
            </div>
        </form>
    </div>
</body>
</html>
