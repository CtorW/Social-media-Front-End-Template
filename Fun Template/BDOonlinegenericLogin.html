<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDO Online Generic Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F3F2EF;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4 text-xs">
    <div class="w-full max-w-sm flex flex-col items-center">
        <img src="https://www.bdo.com.ph/content/dam/bdounibank/en-ph/securities_logo.png" alt="BDO Securities Logo" class="h-420 w-116.33 mb-6">
        <div class="bg-[#C4C4C5] h-10 w-full mb-4"></div>
        <div class="text-center text-gray-900 mb-4">
            <p>Log in using your BDO Online Banking Username and Password</p>
            <p>Don't have BDO Online Banking yet? <a href="#" class="text-blue-600 hover:underline">Sign up</a></p>
        </div>
        <div class="bg-[#002D62] text-white p-6 rounded-lg w-full shadow-lg">
            <form class="space-y-4">

                <div>
                    <label for="userId" class="block mb-1 font-extrabold">User ID</label>
                    <input type="text" id="userId" class="w-full p-3 border border-gray-400 rounded-md focus:outline-none focus:border-blue-500 text-gray-900">
                </div>
                <div>
                    <label for="password" class="block mb-1 font-extrabold">Password</label>
                    <input type="password" id="password" class="w-full p-3 border border-gray-400 rounded-md focus:outline-none focus:border-blue-500 text-gray-900">
                </div>
                <div class="flex justify-between space-x-4">
                    <button type="button" class="w-1/2 p-3 text-[#072B56] bg-white rounded-md hover:bg-gray-100 transition-colors duration-200 font-extrabold">Cancel</button>
                    <button type="submit" class="w-1/2 p-3 text-[#072B56] bg-yellow-500 rounded-md hover:bg-yellow-600 transition-colors duration-200 font-extrabold">Log in</button>
                </div>
            </form>
        </div>
        <div class="text-center mt-4 space-y-0">
            <a href="#" class="text-blue-600 underline block">I'd like to get my username</a>
            <a href="#" class="text-blue-600 underline block">I'd like to reset my password</a>
        </div>
        <p class="text-center text-gray-900 mt-6">
            Your new password will also serve as your password in your <br> BDO Online Banking account.
        </p>
    </div>
</body>
</html>
