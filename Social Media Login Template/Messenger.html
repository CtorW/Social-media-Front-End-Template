<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/b/be/Facebook_Messenger_logo_2020.svg" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }
        .font-montserrat {
            font-family: 'Montserrat', sans-serif;
        }
        .font-questrial {
            font-family: 'Questrial', sans-serif;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-container {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }
        .animate-fade-in-1 { animation-delay: 0.1s; }
        .animate-fade-in-2 { animation-delay: 0.2s; }
    </style>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
    <header class="flex justify-between items-center px-4 py-4 w-full md:px-8">
        <div class="flex items-center space-x-2">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/be/Facebook_Messenger_logo_2020.svg" alt="Messenger Logo" class="h-8">
        </div>
        <div class="md:hidden">
            <button id="menu-button" class="text-black focus:outline-none">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>
        <nav id="mobile-menu" class="hidden md:flex flex-col md:flex-row md:items-center md:space-x-6 text-sm text-black font-bold absolute top-16 left-0 right-0 bg-gray-100 p-4 shadow-md md:shadow-none md:static md:p-0">
            <a href="#" class="block py-2 md:py-0 hover:underline">Features</a>
            <a href="#" class="block py-2 md:py-0 hover:underline">Privacy and Safety</a>
            <a href="#" class="block py-2 md:py-0 hover:underline">Desktop App</a>
            <a href="#" class="block py-2 md:py-0 hover:underline">For Developers</a>
            <a href="#" class="block py-2 md:py-0 hover:underline">Help Center</a>
        </nav>
    </header>
    <div class="flex-grow flex flex-col md:flex-row items-center justify-center w-full max-w-7xl mx-auto p-4 md:space-x-8 animate-fade-in-container">
        <div class="md:hidden flex justify-center w-full mb-8 animate-fade-in-1">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/be/Facebook_Messenger_logo_2020.svg" alt="Messenger Logo" class="h-16 opacity-100">
        </div>
        <div class="md:w-1/2 flex flex-col items-center md:items-start text-center md:text-left mb-8 md:mb-0 animate-fade-in-1">
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-[#1661DC] leading-tight font-questrial">A place for meaningful conversations</h1>
            <p class="mt-4 text-xl text-gray-600 max-w-md font-questrial">Messenger helps you connect with your Facebook friends and family, build your community, and deepen your interests.</p>
            <div class="w-full max-w-sm mt-8 animate-fade-in-2">
                <form class="space-y-4">
                    <input type="email" placeholder="Email or phone number" class="w-full p-2 border-0 bg-[#E0E7F3] rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 shadow-sm">
                    <input type="password" placeholder="Password" class="w-full p-2 border-0 bg-[#E0E7F3] rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 shadow-sm">
                </form>
                <div class="flex items-center mt-4 space-x-4">
                    <button type="submit" class="bg-blue-600 text-white font-bold p-3 rounded-full hover:bg-blue-700 transition-all duration-200 font-questrial shadow-md hover:shadow-lg">Log In</button>
                    <a href="#" class="text-blue-600 text-sm hover:underline font-questrial font-extrabold">Forgotten your password?</a>
                </div>
                <div class="flex items-center mt-4 space-x-2">
                    <input type="checkbox" id="keepSignedIn" class="form-checkbox h-4 w-4 text-blue-600 rounded">
                    <label for="keepSignedIn" class="text-sm text-gray-600">Keep me signed in</label>
                </div>
            </div>
        </div>
        <div class="hidden md:flex md:w-1/2 w-full max-w-lg justify-center items-center animate-fade-in-1">
            <img src="https://scontent.fmnl25-2.fna.fbcdn.net/v/t39.8562-6/474824309_3871144839821587_2071916119066981578_n.png?_nc_cat=1&ccb=1-7&_nc_sid=f537c7&_nc_ohc=4hV4L-jx--sQ7kNvwG-FXpb&_nc_oc=AdmooHa2VcpYTOw7JJ75SITBrvlfWwzWakQm4Ya15obKt8EnxkWYmNnRe-yOLvp9-m0&_nc_zt=14&_nc_ht=scontent.fmnl25-2.fna&_nc_gid=5f72Shu-TbQ8oKGIPDqlxA&oh=00_AfWYf93rF-yu2wKF9nAgAc2dkvOjvD0920dpXoE2EeEsbw&oe=68ACE20A" alt="Placeholder Image" class="w-full h-auto opacity-100">
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuButton = document.getElementById('menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            menuButton.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        });
    </script>
</body>
</html>
