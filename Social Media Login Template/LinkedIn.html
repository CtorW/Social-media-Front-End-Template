<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Login, Sign in | LinkedIn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://static.licdn.com/scds/common/u/images/logos/favicons/v1/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F3F2EF;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-container {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }
        .animate-fade-in-1 { animation-delay: 0.1s; }
        .animate-fade-in-2 { animation-delay: 0.2s; }
        .animate-fade-in-3 { animation-delay: 0.3s; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">
    <header class="w-full py-4 px-8 flex justify-center md:justify-start">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/LinkedIn_logo.svg" alt="LinkedIn Logo" class="h-8">
    </header>
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-sm flex flex-col items-center animate-fade-in-container">
            <div class="bg-white p-6 rounded-lg shadow-lg w-full">
                <h1 class="text-3xl font-semibold mb-6 text-left animate-fade-in-1">Sign in</h1>
                <button class="w-full flex items-center justify-center bg-transparent border border-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-full mb-2 hover:bg-gray-200 transition-colors duration-200 animate-fade-in-2">
                    <img src="https://www.google.com/favicon.ico" alt="Google Logo" class="h-5 w-5 mr-2">Sign in with Google</button>
                <button class="w-full flex items-center justify-center bg-transparent border border-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-full mb-2 hover:bg-gray-200 transition-colors duration-200 animate-fade-in-2">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple Logo" class="h-5 w-5 mr-2">Sign in with Apple
                </button>
                <div class="flex items-center my-4 animate-fade-in-2">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="flex-shrink mx-4 text-gray-500 text-sm">or</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>
                <form class="space-y-4 animate-fade-in-3">
                    <input type="text" placeholder="Email or phone" class="w-full p-3 border border-gray-900 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 transition-shadow duration-200 shadow-sm">
                    <div class="relative">
                        <input type="password" id="passwordInput" placeholder="Password" class="w-full p-3 border border-gray-900 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 transition-shadow duration-200 shadow-sm">
                        <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-blue-600 font-bold text-sm">Show</button>
                    </div>
                    <a href="#" class="block text-sm text-blue-600 font-bold hover:underline">Forgot password?</a>
                    <div class="flex items-center">
                        <input type="checkbox" id="keep-logged-in" class="form-checkbox h-4 w-4 text-blue-600 rounded">
                        <label for="keep-logged-in" class="ml-2 text-sm text-gray-600">Keep me logged in</label>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold p-3 rounded-full hover:bg-blue-700 transition-all duration-200 shadow-md hover:shadow-lg">Sign in</button>
                </form>
            </div>
                <div class="mt-6 text-center animate-fade-in-3">
                <p class="text-sm text-gray-600">New to LinkedIn? <a href="#" class="text-blue-600 font-bold hover:underline">Join now</a></p>
            </div>

        </div>
    </main>
    <footer class="w-full p-4 text-xs text-gray-600 text-center flex flex-wrap justify-center items-center space-x-4">
        <p class="font-bold">LinkedIn</p>
        <p>&copy; 2025</p>
        <a href="#" class="hover:underline">User Agreement</a>
        <a href="#" class="hover:underline">Privacy Policy</a>
        <a href="#" class="hover:underline">Community Guidelines</a>
        <a href="#" class="hover:underline">Cookie Policy</a>
        <a href="#" class="hover:underline">Copyright Policy</a>
        <a href="#" class="hover:underline">Send Feedback</a>
        <a href="#" class="hover:underline">Language</a>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('passwordInput');
            const togglePassword = document.getElementById('togglePassword');
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.textContent = type === 'password' ? 'Show' : 'Hide';
            });
        });
    </script>
</body>
</html>
