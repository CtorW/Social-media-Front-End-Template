<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonalds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="shortcut icon" href="https://www.mcdonaldsapps.com/vectors/m.0191143e.svg" type="image/x-icon">
    <style>
        body {
            font-family: sans-serif;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">
    <header class="w-full py-4 px-8 flex justify-between items-center">
        <div class="flex items-center">
            <img src="https://www.mcdonaldsapps.com/vectors/m.0191143e.svg" alt="McDonald's Logo" class="h-8">
        </div>
        <div class="flex items-center space-x-2 text-sm text-gray-600">
            <span class="material-symbols-outlined text-gray-600" style="font-size: 16px;">language</span>
            <p>English</p>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </div>
    </header>
    <main class="flex-grow flex flex-col justify-center p-4 items-center">
        <div class="w-full max-w-md">
            <h1 class="text-3xl font-extrabold text-left mb-6 text-gray-800">Log in to your account</h1>
            <form class="space-y-6">
                <div class="relative">
                    <input type="email" placeholder="Email" class="w-full p-4 border-b border-gray-400 focus:outline-none focus:border-yellow-500 bg-transparent text-gray-800 placeholder-gray-500">
                </div>
                <div class="relative">
                    <input type="password" placeholder="Password" class="w-full p-4 border-b border-gray-400 focus:outline-none focus:border-yellow-500 bg-transparent text-gray-800 placeholder-gray-500">
                    <svg class="absolute right-3 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                </div>
                <a href="#" class="block text-sm text-blue-500 hover:underline text-left">Forgot your password?</a>
                <button type="submit" class="w-full bg-yellow-400 text-gray-800 font-bold py-3 hover:bg-yellow-500 transition-colors duration-200">
                    Log in to your account
                </button>
            </form>
            <footer class="text-sm text-gray-600 text-left p-4 mt-6">
                <div class="flex flex-wrap space-x-4">
                    <p>Copyright © 2025 McDonald's</p>
                    <a href="#" class="text-blue-500 hover:underline">Privacy Statement</a>
                    <a href="#" class="text-blue-500 hover:underline">Contacts</a>
                </div>
            </footer>
        </div>
    </main>
</body>
</html>
