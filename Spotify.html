<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Log in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" href="https://www.spotify.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #121212 0%, #000000 100%);
            color: #ffffff;
            background-attachment: fixed;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        .form-element-1 { animation: fadeIn 0.6s ease-out forwards; animation-delay: 0.1s; }
        .form-element-2 { animation: fadeIn 0.6s ease-out forwards; animation-delay: 0.2s; }
        .form-element-3 { animation: fadeIn 0.6s ease-out forwards; animation-delay: 0.3s; }
        .form-element-4 { animation: fadeIn 0.6s ease-out forwards; animation-delay: 0.4s; }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col p-4">
    <div class="flex-grow flex justify-center items-center">
        <div class="flex flex-col items-center w-full animate-fade-in" data-max-width="512px">
            <div class="w-full bg-black rounded-xl shadow-lg p-6">
                <div class="flex flex-col items-center justify-center mb-8">
                    <img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/spotify-white-icon.png" alt="Spotify Logo" class="h-12 mb-4">
                    <h1 class="text-2xl font-bold">Log in to Spotify</h1>
                </div>
                <form class="space-y-4">
                    <button type="button" class="w-full bg-black border border-gray-700 text-white font-bold py-3 rounded-full hover:bg-gray-800 transition-colors duration-200 flex items-center justify-center space-x-2 form-element-1">
                        <img src="https://www.google.com/favicon.ico" alt="Google Logo" class="h-5 w-5">
                        <span>Continue with Google</span>
                    </button>
                    <button type="button" class="w-full bg-black border border-gray-700 text-white font-bold py-3 rounded-full hover:bg-gray-800 transition-colors duration-200 flex items-center justify-center space-x-2 form-element-2">
                        <img src="https://www.facebook.com/favicon.ico" alt="Facebook Logo" class="h-5 w-5">
                        <span>Continue with Facebook</span>
                    </button>
                    <button type="button" class="w-full bg-black border border-gray-700 text-white font-bold py-3 rounded-full hover:bg-gray-800 transition-colors duration-200 flex items-center justify-center space-x-2 form-element-3">
                        <img src="https://www.apple.com/favicon.ico" alt="Apple Logo" class="h-5 w-5">
                        <span>Continue with Apple</span>
                    </button>
                    <div class="flex items-center space-x-2 my-4">
                        <hr class="flex-grow border-gray-700">
                        <span class="text-gray-400 text-sm">or</span>
                        <hr class="flex-grow border-gray-700">
                    </div>
                    <div class="mb-4 form-element-4">
                        <label for="email" class="block text-sm font-medium text-gray-400 mb-2">Email or username</label>
                        <input type="text" id="email" placeholder="Email or username" class="w-full p-4 border border-gray-700 rounded-md bg-black text-white focus:outline-none focus:ring-1 focus:ring-green-500 transition-colors">
                    </div>
                    <div class="mb-4 form-element-5">
                        <label for="password" class="block text-sm font-medium text-gray-400 mb-2">Password</label>
                        <input type="password" id="password" placeholder="Password" class="w-full p-4 border border-gray-700 rounded-md bg-black text-white focus:outline-none focus:ring-1 focus:ring-green-500 transition-colors">
                    </div>
                    <button type="button" class="w-full bg-green-500 text-black font-bold py-3 rounded-full hover:bg-green-600 transition-colors duration-200 form-element-6 shadow-md hover:shadow-lg">Log In</button>
                    <a href="#" class="block text-center text-sm text-gray-400 hover:text-green-500 transition-colors duration-200 mt-4 form-element-7">Don't have an account? Sign up for Spotify</a>
                </form>
            </div>
        </div>
    </div>
    <div class="w-full max-w-sm mx-auto p-4 text-center text-xs text-gray-400">
        <p>This site is protected by reCAPTCHA and the Google <a href="#" class="text-gray-400 hover:underline">Privacy Policy</a> and <a href="#" class="text-gray-400 hover:underline">Terms of Service</a> apply.</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('[data-max-width]');
            if (container) {
                const maxWidth = container.getAttribute('data-max-width');
                if (maxWidth) {
                    container.style.maxWidth = maxWidth;
                }
            }
        });
    </script>
</body>
</html>
